name: POST_STRELKA
description: |
  This module processes Strelka SNV and indel VCF files by concatenating, filtering, and normalizing them.
  It outputs a single VCF file with updated sample names for the normal and tumor samples.
author: BIC @ MSKCC <bicrequest@mskcc.org>
date: 2025-04-22
version: '1.0.0'
keywords:
  - Strelka
  - VCF
  - Variant Calling
  - Post-processing
input:
  - - meta:
      type: map
      description: |
        Groovy Map containing metadata information
        e.g. [ id:'test', normal:'normal_sample', tumor:'tumor_sample' ]
    - snv_vcf:
      type: path
      description: Path to the Strelka SNV VCF file.
    - indel_vcf:
      type: path
      description: Path to the Strelka indel VCF file.
  - target_bed:
      type: path
      description: Path to the BED file used for filtering the VCF.
output:
  - vcf:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_strelka.vcf":
          type: file
          description: VCF file output
          pattern: "*_strelka.vcf"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
process:
  container:
    - community.wave.seqera.io/library/bcftools:1.21--4335bec1d7b44d11
    - https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/5a/5acacb55c52bec97c61fd34ffa8721fce82ce823005793592e2a80bf71632cd0/data
  labels:
    - process_medium
  tags:
    - "${meta.id}"
script:
  description: |
    The script performs the following steps:
    1. Concatenates the SNV and indel VCF files using `bcftools concat`.
    2. Compresses the concatenated VCF file with `bgzip` and indexes it with `tabix`.
    3. Filters the VCF file using the provided BED file with `bcftools view`.
    4. Sorts and normalizes the VCF file using `bcftools sort` and `bcftools norm`.
    5. Updates the sample names in the VCF header to reflect the normal and tumor sample IDs.
    6. Outputs the processed VCF file and a `versions.yml` file containing the `bcftools` version.
